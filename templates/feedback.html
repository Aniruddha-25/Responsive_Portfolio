<section id="feedback" class="section">
  <h2>Feedback</h2>
  <form
    class="feedback-form"
    id="feedback-form"
  >

    <div class="form-group">
      <label for="name">Name:</label>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your Name"
        required
      />
    </div>
    <div class="form-group">
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Your Email"
        required
      />
    </div>
    <div class="form-group">
      <label for="message">Message:</label>
      <textarea
        id="message"
        name="message"
        rows="5"
        placeholder="Your Feedback"
        required
      ></textarea>
    </div>

    <button type="submit" class="btn" id="submit-button">
      Submit Feedback
    </button>
  </form>

  <div id="form-messages">
    <p id="success-message">Feedback sent successfully!</p>
    <p id="error-message">Failed to send feedback. Please try again.</p>
  </div>
</section>
