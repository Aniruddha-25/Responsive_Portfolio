<!-- Certification Viewer -->
<div id="certificationViewer" class="certification-viewer">
  <div class="certification-viewer-overlay"></div>
  <div class="certification-viewer-card">
    <button class="certification-viewer-close" id="closeCertViewer">
      <i class="fas fa-times"></i>
    </button>
    <div class="certification-viewer-header">
      <i class="fas fa-certificate"></i>
      <h3 class="certification-viewer-title">Certificate Preview</h3>
    </div>
    <div class="certification-viewer-content">
      <iframe id="certViewerFrame" class="certification-viewer-iframe"></iframe>
    </div>
  </div>
</div>
